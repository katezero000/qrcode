name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrscanner-release
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/QRScanner-release.apk

      - name: Get version name
        if: github.event_name != 'pull_request'
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=v1.1-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: "二维码扫描 ${{ steps.version.outputs.name }}"
          body: |
            ## 二维码扫描 Android 应用 v1.1

            ### 更新内容
            - 🎨 全新 UI 配色（紫色主题 + 渐变背景）
            - 🔄 相机扫码界面固定竖屏方向
            - 🖼️ 应用图标焕新升级

            ### 功能特性
            - 📷 相机实时扫码（支持二维码和条形码）
            - 🖼️ 图片导入扫码
            - ✏️ 扫描结果可编辑
            - 📋 一键复制到剪贴板

            ### 安装说明
            下载 `QRScanner-release.apk` 文件，在 Android 设备上安装即可。
            安装前请确保已开启「允许安装未知来源应用」。
          files: release_artifacts/QRScanner-release.apk
          make_latest: true
